name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Ahova.Bridge.slnx
      - run: dotnet format Ahova.Bridge.slnx --verify-no-changes --no-restore
      - run: dotnet test Ahova.Bridge.slnx --no-restore
      - run: sh -n scripts/install.sh scripts/ahova-bridge.sh scripts/publish-wiki.sh
      - name: Parse PowerShell helpers
        shell: pwsh
        run: >-
          $errors = @();
          foreach ($path in 'scripts/install.ps1','scripts/ahova-bridge.ps1') {
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
          };
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build .
